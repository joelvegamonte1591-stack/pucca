
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para mi persona favorita 🌻</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    overflow:hidden;
    font-family:'Segoe UI',sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(#091540,#1a1a40,#2d2357);
}

.stars{
position:absolute;
width:100%;
height:100%;
background:
radial-gradient(white 1px, transparent 1px);
background-size:45px 45px;
animation:twinkle 6s infinite alternate;
opacity:.45;
}

@keyframes twinkle{
from{opacity:.25;}
to{opacity:.75;}
}

.container{
text-align:center;
position:relative;
z-index:2;
padding:20px;
max-width:800px;
}

h1{
color:#FFD84D;
font-size:2.8rem;
margin-bottom:15px;
animation:fadeDown 2s ease;
}

p{
color:white;
font-size:1.2rem;
line-height:1.6;
animation:fadeUp 2s ease;
}

.flowers{
display:flex;
justify-content:center;
gap:18px;
margin:40px 0;
}

.flower{
position:relative;
width:90px;
height:180px;
animation:bloom 2s ease forwards;
transform:scale(0);
}

.stem{
position:absolute;
left:50%;
bottom:0;
transform:translateX(-50%);
width:8px;
height:95px;
background:#2ecc71;
border-radius:5px;
}

.center{
position:absolute;
top:38px;
left:50%;
transform:translateX(-50%);
width:30px;
height:30px;
background:#7a4b00;
border-radius:50%;
z-index:3;
}

.petal{
position:absolute;
width:34px;
height:50px;
background:#FFD633;
border-radius:50%;
transform-origin:center 28px;
}

.petal:nth-child(1){top:6px;left:28px;}
.petal:nth-child(2){top:18px;left:7px;transform:rotate(-60deg);}
.petal:nth-child(3){top:18px;right:7px;transform:rotate(60deg);}
.petal:nth-child(4){top:46px;left:8px;transform:rotate(-120deg);}
.petal:nth-child(5){top:46px;right:8px;transform:rotate(120deg);}
.petal:nth-child(6){top:64px;left:28px;transform:rotate(180deg);}

@keyframes bloom{
to{transform:scale(1);}
}

@keyframes fadeDown{
from{opacity:0;transform:translateY(-30px);}
to{opacity:1;transform:translateY(0);}
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(30px);}
to{opacity:1;transform:translateY(0);}
}

.falling{
position:absolute;
top:-20px;
font-size:24px;
color:#FFD633;
animation:fall linear infinite;
opacity:.8;
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(360deg);
opacity:.2;
}
}

button{
margin-top:20px;
padding:14px 30px;
border:none;
border-radius:30px;
background:#FFD633;
color:#222;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.08);
background:#ffe46b;
}

#extra{
margin-top:20px;
font-size:1.15rem;
color:#ffeaa7;
opacity:0;
transition:1s;
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="container">

<h1>🌻 Para la heroína de mi universo 🌻</h1>

<div class="flowers">
<div class="flower">
<div class="petal"></div><div class="petal"></div><div class="petal"></div>
<div class="petal"></div><div class="petal"></div><div class="petal"></div>
<div class="center"></div>
<div class="stem"></div>
</div>

<div class="flower" style="animation-delay:.3s;">
<div class="petal"></div><div class="petal"></div><div class="petal"></div>
<div class="petal"></div><div class="petal"></div><div class="petal"></div>
<div class="center"></div>
<div class="stem"></div>
</div>

<div class="flower" style="animation-delay:.6s;">
<div class="petal"></div><div class="petal"></div><div class="petal"></div>
<div class="petal"></div><div class="petal"></div><div class="petal"></div>
<div class="center"></div>
<div class="stem"></div>
</div>
</div>

<p>
Si el multiverso existiera con infinitas posibilidades,
volvería a buscarte una y otra vez.
Porque, incluso entre millones de universos,
seguirías siendo mi historia favorita.
</p>

<button onclick="mostrar()">❤️ Presiona aquí</button>

<div id="extra">
"Eres mi pequeño punto brillante en este universo caótico.
Te quiero muchísimo."
</div>

</div>

<script>
function mostrar(){
document.getElementById("extra").style.opacity="1";
}

for(let i=0;i<28;i++){
const petal=document.createElement("div");
petal.className="falling";
petal.innerHTML="🌻";
petal.style.left=Math.random()*100+"vw";
petal.style.animationDuration=(6+Math.random()*6)+"s";
petal.style.animationDelay=Math.random()*6+"s";
petal.style.fontSize=(18+Math.random()*18)+"px";
document.body.appendChild(petal);
}
</script>

</body>
</html>
